name: Python CI & CAN Bus Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Kod Standartları Kontrolü (Lint with flake8)
      run: |
        # Sözdizimi (syntax) hatalarını kontrol et
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Karmaşıklık ve stil uyarıları
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Birim Testleri Çalıştır (Pytest)
      run: |
        pytest tests/ -v

    - name: Sanal CAN Simülasyon Çalışma Testi
      run: |
        # 3 saniyelik sanal CAN sinyal akışını doğrula
        python -c "import run_simulation, threading, time; t = threading.Thread(target=run_simulation.main, daemon=True); t.start(); time.sleep(3); print('GitHub Actions: Virtual CAN simulation test passed successfully!')"
