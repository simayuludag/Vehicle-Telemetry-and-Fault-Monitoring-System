name: J1939 Telemetry CI/CD & Docker Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Python ${{ matrix.python-version }} Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Kod Standartları Kontrolü (Lint with flake8)
      run: |
        # Sözdizimi ve kritik hata denetimi
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Standart stil kontrolleri
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics

    - name: SAE J1939 & Filo Birim Testlerini Çalıştır (Pytest)
      run: |
        pytest tests/ -v

    - name: Simülasyon Çalışma Doğrulaması (Smoke Test)
      run: |
        python -c "from j1939.simulator import FleetSimulator; sim = FleetSimulator(); sim.start(); import time; time.sleep(1); sim.stop(); print('J1939 Simulator test OK!')"

  docker-build:
    name: Docker Image Build & Validation
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
    - name: Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Docker İmajını Derle (Build Test)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: j1939-fleet-telemetry:latest
